[package]
name = "life-zone"
version = "0.1.0"
description = "Life Zone — a locally-run simulation of a community of creatures"
authors = ["Rob Righter"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique against the bin name on Windows.
name = "life_zone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `bundled` compiles SQLite from source: not optional on Windows (BUILD.md §4).
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

# ChaCha8 is reproducible across platforms, unlike StdRng (BUILD.md §4).
rand = "0.8"
rand_chacha = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"

anyhow = "1"
thiserror = "2"

# Blocking HTTP for the Ollama client. Deliberately not reqwest: the simulation
# thread is synchronous and owns its own concurrency, so pulling in a tokio
# runtime would buy nothing and complicate the one place in the codebase where
# determinism matters most.
# No TLS: Ollama is a local HTTP endpoint on the loopback interface, and the
# app makes no other network calls at all (BUILD.md §7.5 — the CSP forbids
# off-origin requests). Pulling in rustls costs a `ring` build that needs an
# assembler this ARM64 host does not have, to secure a connection to 127.0.0.1.
ureq = { version = "2", default-features = false, features = ["json"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.dev]
# The simulation is unusably slow in a fully unoptimised dev build; optimise
# dependencies while keeping our own crate debuggable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
